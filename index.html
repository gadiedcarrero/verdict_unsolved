<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' https://storage.googleapis.com https://*.elevenlabs.io"
    />
    <!-- img-src blob: — URL.createObjectURL(file) para previsualizar una
         imagen de referencia recién pegada/soltada en el panel de edición
         (ver imageEditReferences en AdventureRuntime.tsx), antes de que
         exista ningún path real en assets/. Sin esto el <img> quedaba roto
         con un error de CSP silencioso, igual que pasaba con las muestras
         de audio de ElevenLabs (ver media-src abajo). -->
    <!-- media-src: ahí sirve ElevenLabs las muestras de audio de sus voces
         (preview_url) — ver VoiceRow en CharacterEditorPanel.tsx. El
         preview_url "general" de un voice vive en storage.googleapis.com,
         pero las muestras por idioma (verified_languages[].preview_url)
         vienen de un subdominio regional de la propia API (ej:
         api.us.elevenlabs.io) — de ahí el wildcard *.elevenlabs.io en vez
         de listar cada región a mano. Sin esto, default-src 'self' bloquea
         la reproducción del <audio> con un error de CSP silencioso. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NarraDos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
